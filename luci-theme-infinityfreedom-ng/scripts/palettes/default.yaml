# Homelede InfinityFreedom-NG theme - default palette (baseline).
#
# This is the CURRENT color set of the theme, tokenized. It exists so the
# generator has a single source of truth for every hardcoded color it must
# be able to recolor, and so new palettes can diff against the baseline.
#
# Structure: role -> color. Roles map to hardcoded colors via the per-file
# COLOR_MAP in gen-palettes.py (each map entry: old hardcoded color -> role).

name: default
label: "默认（现有配色）"

# ---- backgrounds (page depth scale) ----
bg-deep: "#303841"           # body background base (under bg image)
bg-base: "#323a46"           # section/table head backgrounds
bg-card: "#36404a"           # card / panel surface
bg-card2: "#424e5a"          # raised surface: table headers, inputs, hover rows
bg-hover: "#3b4651"          # hover/active surface between card and card2

# ---- lines & borders ----
line: "#5d7186"              # primary border color
line-muted: "#76838f"        # subtle dividers
line-bright: "#8ea3b5"       # lifted line: neutral button borders

# ---- text ----
text-body: "#94a0ad"         # default body text
text-dim: "#8c98a5"          # secondary text
text-bright: "#cedeef"       # headings, strong text
text-onaccent: "#f3f7f9"     # text on accent surfaces

# ---- accent (brand color) ----
accent: "#348cd4"            # primary accent (buttons, active menu, links)
accent-strong: "#21649b"     # pressed / active buttons
accent-soft: "#94b7dc"       # soft accent: hovers, subtle fills
accent-glow: "#82add6"       # glow / highlight variant

# ---- semantic states (calibrated per palette) ----
success: "#78c350"
success-deep: "#487530"
warning: "#ff9800"
warning-deep: "#b36a00"
danger: "#f7531f"
danger-deep: "#943213"
info: "#45bbe0"
info-deep: "#297086"
pink: "#f06292"
purple: "#8892d6"

# ---- special surfaces ----
scrollbar: "#3b4651"
loading-cover: "#37424c"
progress-track: "#424e5a"
badge-danger-bg: "#f7531f"

# page background image (under /assets/images/backgrounds/); gray-scale
# canyon photo that reads neutral under both palettes
bg-image: "12.jpg"

# mobile browser chrome color (meta theme-color)
meta-theme-color: "#303841"
